services:
  - type: web
    name: observa-backend
    env: python
    rootDir: Hackspora 2.0/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./observa.db
      - key: PORT
        value: 10000
